name: VIAIOS CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===== Frontend (Build + TypeCheck + Lint) =====
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: web/frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: web/frontend/dist }
      - name: Check bundle size
        run: |
          echo "=== Chunk Sizes ==="
          du -sh web/frontend/dist/assets/*.js 2>/dev/null | sort -rh | head -15 || true
          echo "=== Total Dist ==="
          du -sh web/frontend/dist 2>/dev/null || true

  # ===== Backend Java (Compile + Test) =====
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      # Cache Gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Compile all Java services
      - name: Compile Java services
        run: |
          ./gradlew compileJava -x test --no-daemon 2>&1 | tail -30
          echo "Java compile OK"

      # Python syntax check
      - name: Python syntax check
        run: |
          find services -name "*.py" -not -path "*__pycache__*" -not -path "*node_modules*" | while read f; do
            python -m py_compile "$f" && echo "  OK: $f" || { echo "  FAIL: $f"; exit 1; }
          done
          echo "Python syntax OK"

  # ===== E2E Tests (Playwright) =====
  e2e:
    needs: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run E2E critical flow
        run: npx playwright test tests/e2e/critical-flow.spec.ts --project=chromium
        env: { BASE_URL: '${{ secrets.VIAIOS_URL }}' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/

  # ===== k6 Performance Tests =====
  performance:
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install k6
        run: |
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update && sudo apt-get install -y k6

      - name: Run smoke test (quick)
        if: github.event_name == 'pull_request'
        run: k6 run --duration 10s --vus 2 --iterations 20 tests/performance/smoke-test.js 2>&1 || true
        env:
          VIAIOS_BASE_URL: '${{ secrets.VIAIOS_URL }}'

      - name: Run load test (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: k6 run --duration 60s --vus 10 tests/performance/load-test.js 2>&1 || true
        env:
          VIAIOS_BASE_URL: '${{ secrets.VIAIOS_URL }}'

  # ===== Deploy to Production =====
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, e2e]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: frontend-dist, path: web/frontend/dist }

      # Upload agent-service Python code
      - name: Deploy agent-service
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VIAIOS_HOST }}
          port: ${{ secrets.VIAIOS_PORT }}
          username: ${{ secrets.VIAIOS_USER }}
          password: ${{ secrets.VIAIOS_PASS }}
          source: "services/agent-service/src/agent_service/**"
          target: "/opt/viaios/services/agent-service/src/agent_service/"
          strip_components: 3
          rm: false

      # Upload frontend dist
      - name: Deploy frontend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VIAIOS_HOST }}
          port: ${{ secrets.VIAIOS_PORT }}
          username: ${{ secrets.VIAIOS_USER }}
          password: ${{ secrets.VIAIOS_PASS }}
          source: "web/frontend/dist/*"
          target: "/opt/viaios/frontend/dist/"
          strip_components: 2
          rm: false

      # Restart services
      - name: Restart services on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VIAIOS_HOST }}
          port: ${{ secrets.VIAIOS_PORT }}
          username: ${{ secrets.VIAIOS_USER }}
          password: ${{ secrets.VIAIOS_PASS }}
          script: |
            systemctl restart viaios-py-agent viaios-py-capability viaios-py-knowledge
            nginx -s reload 2>/dev/null || systemctl reload nginx
            sleep 8

            # Quick health check
            echo "=== Health Check After Deploy ==="
            for p in 8080 8191 8192 8193; do
              code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:$p/actuator/health 2>/dev/null)
              echo "  Port $p: HTTP $code"
            done

            # Verify agent-service new endpoints
            curl -s http://localhost:8191/api/system/models 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'  Models: {d[\"total\"]} loaded')" 2>/dev/null || echo "  Models endpoint: check failed"
            echo "Deployed at $(date)" >> /opt/viaios/.deploy_version

      - name: Verify deployment
        run: |
          sleep 5
          echo "=== E2E Verification ==="
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' ${{ secrets.VIAIOS_URL }}/actuator/health)
          echo "Gateway health: HTTP $STATUS"
          curl -s ${{ secrets.VIAIOS_URL }}/api/system/services | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Services: {d[\"up\"]}/{d[\"total\"]} UP')"
