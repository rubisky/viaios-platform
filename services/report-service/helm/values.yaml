replicaCount: 2

image:
  repository: viaios/report-service
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8087

resources:
  limits:
    cpu: "1.0"
    memory: "1Gi"
  requests:
    cpu: "0.5"
    memory: "512Mi"

env:
  - name: SPRING_DATASOURCE_URL
    value: "jdbc:postgresql://postgres:5432/viaios_reports"
  - name: SPRING_DATASOURCE_USERNAME
    value: "viaios"
  - name: REPORT_OUTPUT_BASE_PATH
    value: "/tmp/viaios/reports"

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

readinessProbe:
  httpGet:
    path: /actuator/health
    port: 8087
  initialDelaySeconds: 20
  periodSeconds: 10

livenessProbe:
  httpGet:
    path: /actuator/health
    port: 8087
  initialDelaySeconds: 30
  periodSeconds: 15
