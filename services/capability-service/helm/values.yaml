replicaCount: 2

image:
  repository: viaios/capability-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8092
  targetPort: 8092

env:
  DATABASE_URL: "postgresql://user:password@postgres:5432/viaios"
  MILVUS_URI: "http://milvus:19530"
  MODEL_REGISTRY_URL: "http://model-registry:8085"
  LOG_LEVEL: "INFO"

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
