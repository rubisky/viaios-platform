replicaCount: 2

image:
  repository: viaios/agent-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8091
  targetPort: 8091

env:
  DATABASE_URL: "postgresql+asyncpg://user:password@postgres:5432/viaios"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  REDIS_URL: "redis://redis:6379/0"
  LLM_PROVIDER: "openai"
  LLM_API_KEY: ""
  LLM_MODEL: "gpt-4o"
  LOG_LEVEL: "INFO"

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
