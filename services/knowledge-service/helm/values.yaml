replicaCount: 2

image:
  repository: viaios/knowledge-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8093
  targetPort: 8093

env:
  POSTGRES_URL: "postgresql://user:password@postgres:5432/viaios"
  MILVUS_URI: "http://milvus:19530"
  NEO4J_URI: "bolt://neo4j:7687"
  NEO4J_USER: "neo4j"
  NEO4J_PASSWORD: "password"
  LLM_PROVIDER: "openai"
  LLM_API_KEY: ""
  LLM_MODEL: "gpt-4o"
  EMBEDDING_MODEL: "text-embedding-3-small"
  EMBEDDING_DIMENSION: "1536"
  LOG_LEVEL: "INFO"

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
