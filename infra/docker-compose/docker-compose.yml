version: "3.9"

services:
  # ===== Databases =====
  postgres:
    image: pgvector/pgvector:pg16
    container_name: viaios-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: viaios
      POSTGRES_USER: viaios
      POSTGRES_PASSWORD: viaios123
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viaios"]
      interval: 5s
      retries: 5

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: viaios-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    environment:
      CLICKHOUSE_DB: viaios
      CLICKHOUSE_USER: viaios
      CLICKHOUSE_PASSWORD: viaios123

  milvus:
    image: milvusdb/milvus:v2.4.0-standalone
    container_name: viaios-milvus
    ports:
      - "19530:19530"
      - "9091:9091"

  minio:
    image: minio/minio:latest
    container_name: viaios-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data

  # ===== Messaging =====
  kafka:
    image: bitnami/kafka:3.7
    container_name: viaios-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 1
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: viaios-redis
    ports:
      - "6379:6379"

  etcd:
    image: bitnami/etcd:3.5
    container_name: viaios-etcd
    ports:
      - "2379:2379"
    environment:
      ALLOW_NONE_AUTHENTICATION: "yes"

volumes:
  pgdata:
  miniodata:
