# VIAIOS Edge — Rockchip RK3588 NPU Deployment
# Usage: docker compose -f rk3588-docker-compose.yml up -d

version: "3.9"
services:
  viaios-edge-agent:
    image: viaios/edge-agent:rk3588-2.2
    container_name: viaios-edge-agent
    devices:
      - /dev/dri:/dev/dri
      - /dev/rga:/dev/rga
      - /dev/mpp_service:/dev/mpp_service
    environment:
      - EDGE_DEVICE_ID=${RK3588_ID:-rk3588-001}
      - MQTT_BROKER=${MQTT_BROKER:-cloud-mqtt:1883}
      - RKNN_MODEL_PATH=/opt/viaios/edge/models/rknn
      - ONNX_PROVIDERS=RKNPUExecutionProvider,CPUExecutionProvider
      - MAX_STREAMS=4
      - VIDEO_PORT=8093
      - GST_PLUGIN_PATH=/usr/lib/aarch64-linux-gnu/gstreamer-1.0
    volumes:
      - /opt/viaios/edge/models:/opt/viaios/models:ro
      - /opt/viaios/edge/data:/opt/viaios/data
      - /usr/lib/aarch64-linux-gnu:/host-libs:ro
    ports:
      - "8093:8093"
    restart: unless-stopped

  viaios-edge-rtsp:
    image: viaios/edge-rtsp:rk3588
    environment:
      - RTSP_SOURCES=4
      - HARDWARE_DECODE=1
      - DECODER=rkmpp
      - ENCODER=rkmpp
    volumes:
      - /opt/viaios/edge/data:/opt/viaios/data
    restart: unless-stopped

  viaios-edge-monitor:
    image: viaios/edge-monitor:rk3588
    environment:
      - NPU_MONITOR=1
      - THERMAL_ZONES=4
    volumes:
      - /sys/class/thermal:/thermal:ro
      - /sys/devices/platform/rk_npu:/npu:ro
    ports:
      - "9100:9100"
    restart: unless-stopped
