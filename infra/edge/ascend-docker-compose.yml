# VIAIOS Edge — Huawei Ascend 910B NPU Deployment
# Usage: docker compose -f ascend-docker-compose.yml up -d

version: "3.9"
services:
  viaios-edge-agent:
    image: viaios/edge-agent:ascend-7.0
    container_name: viaios-edge-agent
    devices:
      - /dev/davinci0:/dev/davinci0
      - /dev/davinci1:/dev/davinci1
      - /dev/davinci_manager:/dev/davinci_manager
      - /dev/hisi_hdc:/dev/hisi_hdc
    environment:
      - EDGE_DEVICE_ID=${ASCEND_ID:-ascend-001}
      - MQTT_BROKER=${MQTT_BROKER:-cloud-mqtt:1883}
      - ASCEND_VISIBLE_DEVICES=0,1
      - ONNX_PROVIDERS=CANNExecutionProvider,CPUExecutionProvider
      - MAX_STREAMS=16
      - VIDEO_PORT=8093
    volumes:
      - /opt/viaios/edge/models:/opt/viaios/models:ro
      - /opt/viaios/edge/data:/opt/viaios/data
      - /usr/local/Ascend:/usr/local/Ascend:ro
    ports:
      - "8093:8093"
    restart: unless-stopped

  viaios-edge-rtsp:
    image: viaios/edge-rtsp:ascend
    environment:
      - RTSP_SOURCES=8
      - HARDWARE_DECODE=1
      - DECODER=DVPP
    volumes:
      - /opt/viaios/edge/data:/opt/viaios/data
    restart: unless-stopped

  viaios-edge-monitor:
    image: viaios/edge-monitor:ascend
    environment:
      - NPU_MONITOR=1
    volumes:
      - /usr/local/Ascend/driver:/driver:ro
    ports:
      - "9100:9100"
    restart: unless-stopped
