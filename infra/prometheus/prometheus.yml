# VIAIOS Prometheus Scrape Configuration
# Scrapes all VIAIOS microservices and infrastructure components.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: viaios
    environment: ${PROM_ENV:dev}

scrape_configs:
  # === VIAIOS Java Services ===
  - job_name: viaios-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['api-gateway:8080']
        labels: { service: api-gateway, tier: gateway }

  - job_name: viaios-control-center
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['control-center:8081']
        labels: { service: control-center, tier: platform }

  - job_name: viaios-ai-kernel
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['ai-kernel:8082']
        labels: { service: ai-kernel, tier: ai }

  - job_name: viaios-video-access
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['video-access:8088']
        labels: { service: video-access, tier: access }

  - job_name: viaios-analysis
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['analysis:8084']
        labels: { service: analysis, tier: ai }

  - job_name: viaios-search
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['search:8087']
        labels: { service: search, tier: application }

  - job_name: viaios-case-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['case-service:8085']
        labels: { service: case-service, tier: application }

  - job_name: viaios-report-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['report-service:8086']
        labels: { service: report-service, tier: application }

  - job_name: viaios-alarm-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['alarm-service:8083']
        labels: { service: alarm-service, tier: application }

  - job_name: viaios-workflow-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['workflow-service:8089']
        labels: { service: workflow-service, tier: platform }

  # === VIAIOS Python Services ===
  - job_name: viaios-agent-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['agent-service:8091']
        labels: { service: agent-service, tier: ai }

  - job_name: viaios-capability-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['capability-service:8092']
        labels: { service: capability-service, tier: ai }

  - job_name: viaios-knowledge-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['knowledge-service:8093']
        labels: { service: knowledge-service, tier: ai }

  # === Infrastructure ===
  - job_name: postgresql
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels: { service: postgresql, tier: infrastructure }

  - job_name: kafka
    static_configs:
      - targets: ['kafka-exporter:9308']
        labels: { service: kafka, tier: infrastructure }

  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']
        labels: { service: redis, tier: infrastructure }

  - job_name: clickhouse
    static_configs:
      - targets: ['clickhouse-exporter:9363']
        labels: { service: clickhouse, tier: infrastructure }

  # === GPU Monitoring (optional) ===
  - job_name: dcgm-gpu
    static_configs:
      - targets: ['dcgm-exporter:9400']
        labels: { service: dcgm, tier: gpu }

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']
