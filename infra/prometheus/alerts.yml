# VIAIOS Prometheus Alerting Rules
groups:
  - name: viaios-service-alerts
    rules:
      # === Service Health ===
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.service }} is DOWN"
          description: "{{ $labels.service }} on {{ $labels.instance }} has been down for more than 2 minutes."

      - alert: HighErrorRate
        expr: rate(http_server_requests_seconds_count{status=~"5.."}[5m]) / rate(http_server_requests_seconds_count[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate on {{ $labels.service }}"
          description: "Error rate is {{ $value | humanizePercentage }} on {{ $labels.service }}."

      # === Latency ===
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_server_requests_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High P95 latency on {{ $labels.service }}"
          description: "P95 latency is {{ $value }}s on {{ $labels.service }}."

      # === JVM ===
      - alert: HighJvmMemoryUsage
        expr: (jvm_memory_used_bytes{area="heap"} / jvm_memory_max_bytes{area="heap"}) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "High JVM heap usage on {{ $labels.service }}"
          description: "Heap usage is {{ $value | humanizePercentage }}."

      # === Kafka ===
      - alert: KafkaConsumerLag
        expr: kafka_consumer_group_lag > 1000
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Kafka consumer lag for {{ $labels.consumer_group }}"
          description: "Consumer group {{ $labels.consumer_group }} lag is {{ $value }}."

      # === Database ===
      - alert: DatabaseConnectionPoolExhaustion
        expr: hikaricp_connections_active / hikaricp_connections_max > 0.8
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "DB connection pool nearly exhausted on {{ $labels.service }}"
          description: "{{ $value | humanizePercentage }} of connections in use."

      # === GPU ===
      - alert: HighGpuUtilization
        expr: DCGM_FI_DEV_GPU_UTIL > 90
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "High GPU utilization"
          description: "GPU {{ $labels.gpu }} utilization is {{ $value }}%."

      - alert: HighGpuMemory
        expr: (DCGM_FI_DEV_FB_USED / DCGM_FI_DEV_FB_TOTAL) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High GPU memory usage"
          description: "GPU {{ $labels.gpu }} memory usage is {{ $value | humanizePercentage }}."
